spring:
  datasource:
    url: ${env.DATABASE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5433/betterlearn?stringtype=unspecified}}
    username: ${env.DATABASE_USERNAME:${DATABASE_USERNAME:betterlearn}}
    password: ${env.DATABASE_PASSWORD:${DATABASE_PASSWORD:betterlearn}}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${env.GOOGLE_CLIENT_ID:${GOOGLE_CLIENT_ID:}}
            client-secret: ${env.GOOGLE_CLIENT_SECRET:${GOOGLE_CLIENT_SECRET:}}
            scope: email, profile

app:
  cors:
    allowed-origins: ${env.APP_CORS_ALLOWED_ORIGINS:${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}}
  google:
    redirect-uri: ${env.GOOGLE_REDIRECT_URI:${GOOGLE_REDIRECT_URI:http://localhost:8080/api/auth/google/callback}}
    frontend-callback: ${env.GOOGLE_FRONTEND_CALLBACK:${GOOGLE_FRONTEND_CALLBACK:http://localhost:4200/auth/callback}}
    allowed-origins: ${env.APP_GOOGLE_ALLOWED_ORIGINS:${APP_GOOGLE_ALLOWED_ORIGINS:http://localhost:4200}}
  jwt:
    secret: ${env.JWT_SECRET:${JWT_SECRET:dev-secret-key-change-in-production-must-be-at-least-256-bits-long}}
    expiration-ms: 2592000000  # 30 days
  gemini:
    api-key: ${env.GEMINI_API_KEY:${GEMINI_API_KEY:}}
    model: gemini-2.5-flash

# S3-protocol object storage (Supabase Storage, or any S3-compatible provider)
storage:
  access-key-id: ${env.STORAGE_ACCESS_KEY_ID:${STORAGE_ACCESS_KEY_ID:}}
  secret-access-key: ${env.STORAGE_SECRET_ACCESS_KEY:${STORAGE_SECRET_ACCESS_KEY:}}
  region: ${env.STORAGE_REGION:${STORAGE_REGION:us-east-2}}
  bucket: ${env.STORAGE_BUCKET:${STORAGE_BUCKET:}}
  # S3-compatible endpoint, e.g. https://<ref>.storage.supabase.co/storage/v1/s3.
  # Leave empty to use real AWS S3.
  endpoint: ${env.STORAGE_ENDPOINT:${STORAGE_ENDPOINT:}}

server:
  port: ${PORT:8080}
